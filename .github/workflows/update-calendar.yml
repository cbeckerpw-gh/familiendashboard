name: Kalender automatisch aktualisieren

on:
  schedule:
    - cron: '0 */6 * * *' # Läuft alle 6 Stunden automatisch
  workflow_dispatch: # Erlaubt es dir, den Prozess jederzeit manuell per Klick zu starten!

jobs:
  update-calendar:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Wichtig, damit die Action die JSON-Datei speichern darf
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Kalender abrufen und als JSON speichern
        run: |
          node -e '
          const fs = require("fs");
          async function update() {
              const url = "https://calendar.google.com/calendar/ical/family15160420290140632345%40group.calendar.google.com/public/basic.ics";
              console.log("Lade iCal Daten...");
              const res = await fetch(url);
              const text = await res.text();
              
              // Unser bewährter Parser
              const cleanedText = text.replace(/\r\n[ \t]/g, "").replace(/\n[ \t]/g, "");
              const lines = cleanedText.split(/\r\n|\n|\r/);
              let parsedEvents = [];
              let currentEvent = null;

              lines.forEach(line => {
                  if (line.startsWith("BEGIN:VEVENT")) {
                      currentEvent = {};
                  } else if (line.startsWith("END:VEVENT") && currentEvent) {
                      if (currentEvent.summary && currentEvent.start) {
                          parsedEvents.push(currentEvent);
                      }
                      currentEvent = null;
                  } else if (currentEvent) {
                      const colonIdx = line.indexOf(":");
                      if (colonIdx !== -1) {
                          let key = line.substring(0, colonIdx);
                          if (key.includes(";")) key = key.split(";")[0];
                          const val = line.substring(colonIdx + 1);
                          if (key === "SUMMARY") currentEvent.summary = val;
                          if (key === "DTSTART") currentEvent.start = val;
                          if (key === "LOCATION") currentEvent.location = val;
                          if (key === "DESCRIPTION") currentEvent.description = val;
                      }
                  }
              });

              fs.writeFileSync("calendar.json", JSON.stringify(parsedEvents, null, 2));
              console.log("Erfolgreich! Gefundene Termine:", parsedEvents.length);
          }
          update();
          '

      - name: Änderungen in GitHub speichern
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add calendar.json
          git diff --staged --quiet || (git commit -m "Auto-update calendar.json" && git push)
