name: Kalender automatisch aktualisieren

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-calendar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: node-ical installieren
        run: npm install node-ical

      - name: Kalender abrufen und als JSON speichern
        run: |
          node -e '
          const fs = require("fs");
          const ical = require("node-ical");

          async function update() {
              console.log("📅 Starte Kalender-Aktualisierung...");

              const calendarSources = [
                  { url: "https://calendar.google.com/calendar/ical/family15160420290140632345%40group.calendar.google.com/public/basic.ics", defaultPerson: "eltern" },
                  { url: "https://calendar.google.com/calendar/ical/s.fleher86%40googlemail.com/public/basic.ics", defaultPerson: "mama" },
                  { url: "https://calendar.google.com/calendar/ical/cbecker.pw%40googlemail.com/public/basic.ics", defaultPerson: "papa" }
              ];

              let allEvents = [];
              const now = new Date();
              const startDate = new Date(now.getTime() - 24 * 60 * 60 * 1000); // Gestern
              const endDate = new Date(now.getTime() + 14 * 24 * 60 * 60 * 1000); // 14 Tage in die Zukunft

              for (const source of calendarSources) {
                  try {
                      console.log(`📥 Lade Kalender für Kategorie: [${source.defaultPerson}]...`);
                      const webEvents = await ical.async.fromURL(source.url);
                      let countBefore = allEvents.length;

                      for (let k in webEvents) {
                          const ev = webEvents[k];
                          
                          if (ev.type === "VEVENT") {
                              const pad = (n) => String(n).padStart(2, "0");
                              const formatEvent = (start, end) => {
                                  const eventStart = new Date(start);
                                  const eventEnd = new Date(end);

                                  const startFormatted = ev.dateOnly 
                                      ? `${eventStart.getFullYear()}${pad(eventStart.getMonth() + 1)}${pad(eventStart.getDate())}`
                                      : `${eventStart.getFullYear()}${pad(eventStart.getMonth() + 1)}${pad(eventStart.getDate())}T${pad(eventStart.getHours())}${pad(eventStart.getMinutes())}00Z`;

                                  const endFormatted = ev.dateOnly 
                                      ? `${eventEnd.getFullYear()}${pad(eventEnd.getMonth() + 1)}${pad(eventEnd.getDate())}`
                                      : `${eventEnd.getFullYear()}${pad(eventEnd.getMonth() + 1)}${pad(eventEnd.getDate())}T${pad(eventEnd.getHours())}${pad(eventEnd.getMinutes())}00Z`;

                                  allEvents.push({
                                      sourcePerson: source.defaultPerson,
                                      summary: ev.summary || "Kein Titel",
                                      start: startFormatted,
                                      end: endFormatted,
                                      location: ev.location || "",
                                      description: ev.description || ""
                                  });
                              };

                              // Prüfen, ob es ein Serientermin mit RRULE ist
                              if (ev.rrule) {
                                  const dates = ev.rrule.between(startDate, endDate, true);
                                  dates.forEach(date => {
                                      const duration = new Date(ev.end).getTime() - new Date(ev.start).getTime();
                                      const recurrenceStart = new Date(date);
                                      if (!ev.dateOnly) {
                                          recurrenceStart.setHours(new Date(ev.start).getHours(), new Date(ev.start).getMinutes());
                                      }
                                      const recurrenceEnd = new Date(recurrenceStart.getTime() + duration);
                                      formatEvent(recurrenceStart, recurrenceEnd);
                                  });
                              } else {
                                  // Normaler Einzeltermin
                                  const eventStart = new Date(ev.start);
                                  const eventEnd = new Date(ev.end || ev.start);
                                  if (eventEnd >= startDate && eventStart <= endDate) {
                                      formatEvent(eventStart, eventEnd);
                                  }
                              }
                          }
                      }
                      console.log(`✅ ${source.defaultPerson}: ${allEvents.length - countBefore} Termine im relevanten Zeitraum gefunden.`);
                  } catch (e) {
                      console.error(`❌ Fehler beim Abrufen der URL für [${source.defaultPerson}]:`, e.message);
                  }
              }

              fs.writeFileSync("calendar.json", JSON.stringify(allEvents, null, 2));
              console.log(`💾 Fertig! Insgesamt ${allEvents.length} Termine in calendar.json gespeichert.`);
          }
          update();
          '

      - name: Änderungen in GitHub speichern
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calendar.json
          git diff --staged --quiet || (git commit -m "Auto-update calendar.json" && git pull origin main --rebase && git push)
