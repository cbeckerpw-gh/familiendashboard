name: Kalender automatisch aktualisieren

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  update-calendar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Kalender abrufen und als JSON speichern
        run: |
          node -e '
          const fs = require("fs");
          async function fetchICal(url) {
              const res = await fetch(url);
              return await res.text();
          }

          async function update() {
              // Alle drei Kalender (Familie, Mama, Papa)
              const urls = [
                  "https://calendar.google.com/calendar/ical/family15160420290140632345%40group.calendar.google.com/public/basic.ics",
                  "https://calendar.google.com/calendar/ical/s.fleher86%40googlemail.com/public/basic.ics",
                  "https://calendar.google.com/calendar/ical/cbecker.pw%40googlemail.com/public/basic.ics"
              ];

              let allEvents = [];

              for (const url of urls) {
                  console.log("Lade iCal Daten von:", url);
                  try {
                      const text = await fetchICal(url);
                      const cleanedText = text.replace(/\r\n[ \t]/g, "").replace(/\n[ \t]/g, "");
                      const lines = cleanedText.split(/\r\n|\n|\r/);
                      let currentEvent = null;

                      lines.forEach(line => {
                          if (line.startsWith("BEGIN:VEVENT")) {
                              currentEvent = {};
                          } else if (line.startsWith("END:VEVENT") && currentEvent) {
                              if (currentEvent.summary && currentEvent.start) {
                                  allEvents.push(currentEvent);
                              }
                              currentEvent = null;
                          } else if (currentEvent) {
                              const colonIdx = line.indexOf(":");
                              if (colonIdx !== -1) {
                                  let key = line.substring(0, colonIdx);
                                  if (key.includes(";")) key = key.split(";")[0];
                                  const val = line.substring(colonIdx + 1);
                                  if (key === "SUMMARY") currentEvent.summary = val;
                                  if (key === "DTSTART") currentEvent.start = val;
                                  if (key === "LOCATION") currentEvent.location = val;
                                  if (key === "DESCRIPTION") currentEvent.description = val;
                              }
                          }
                      });
                  } catch (e) {
                      console.error("Fehler beim Laden von URL:", url, e);
                  }
              }

              fs.writeFileSync("calendar.json", JSON.stringify(allEvents, null, 2));
              console.log("Gesamt gefundene Termine aus allen Kalendern:", allEvents.length);
          }
          update();
          '

      - name: Änderungen in GitHub speichern
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add calendar.json
          git diff --staged --quiet || (git commit -m "Auto-update calendar.json from all family calendars" && git push)
