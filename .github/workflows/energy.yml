name: Update Energy Data

on:
  schedule:
    - cron: '*/15 6-22 * * *'  # Tagsüber (von 06:00 bis 22:59 Uhr) alle 5 Minuten
    - cron: '0 * * * *'      # Nachts (von 23:00 bis 05:59 Uhr) nur 1x pro Stunde
  workflow_dispatch: # Erlaubt manuelles Starten in GitHub

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-energy:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Playwright und Browser installieren
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Skript ausführen
        env:
          ISOLAR_USER: ${{ secrets.ISOLAR_USER }}
          ISOLAR_PASS: ${{ secrets.ISOLAR_PASS }}
          MYENERGI_HUB_SN: ${{ secrets.MYENERGI_HUB_SN }}
          MYENERGI_API_KEY: ${{ secrets.MYENERGI_API_KEY }}
        run: node fetch-energy.js

      - name: Änderungen committen und pushen
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add energy.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update energy data" && git pull origin main --rebase -X ours || git rebase --abort)
          git push origin main
