name: Update Energy Data

on:
  schedule:
    - cron: '*/15 * * * *' # Läuft alle 15 Minuten
  workflow_dispatch: # Erlaubt manuelles Starten in GitHub

permissions:
  contents: write

jobs:
  update-energy:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Playwright und Browser installieren
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Skript ausführen
        env:
          ISOLAR_USER: ${{ secrets.ISOLAR_USER }}
          ISOLAR_PASS: ${{ secrets.ISOLAR_PASS }}
          MYENERGI_HUB_SN: ${{ secrets.MYENERGI_HUB_SN }}
          MYENERGI_API_KEY: ${{ secrets.MYENERGI_API_KEY }}
        run: node fetch-energy.js

      - name: Änderungen committen und pushen
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add energy.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update energy data" && git push)
